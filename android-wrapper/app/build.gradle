plugins {
    id "com.android.application"
}

def frontendDir = file("../../frontend")
def frontendDistDir = file("../../frontend/dist")
def bundledEditorDir = file("src/main/assets/editor")

android {
    namespace "com.jundahuang.generalontologyeditor"
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.jundahuang.generalontologyeditor"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            manifestPlaceholders = [usesCleartextTraffic: "true"]
        }
        release {
            manifestPlaceholders = [usesCleartextTraffic: "false"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.register("buildFrontend") {
    inputs.files(fileTree(frontendDir) {
        exclude "dist/**"
        exclude "node_modules/**"
    })
    outputs.dir frontendDistDir

    doLast {
        def isWindows = org.gradle.internal.os.OperatingSystem.current().isWindows()
        def npmCheck = isWindows ? ["cmd", "/c", "where", "npm"] : ["sh", "-c", "command -v npm"]
        def npmAvailable = providers.exec {
            commandLine npmCheck
            ignoreExitValue true
        }.result.get().exitValue == 0

        if (npmAvailable) {
            providers.exec {
                workingDir frontendDir
                commandLine isWindows ? ["cmd", "/c", "npm", "run", "build"] : ["npm", "run", "build"]
            }.result.get().assertNormalExitValue()
            return
        }

        if (file("${frontendDistDir}/index.html").exists()) {
            logger.lifecycle("npm was not found; using existing frontend/dist bundle.")
            return
        }

        throw new GradleException("npm was not found and frontend/dist is missing. Install Node.js or build/copy frontend/dist before assembling the APK.")
    }
}

tasks.register("copyFrontendDist", Copy) {
    dependsOn "buildFrontend"
    from frontendDistDir
    into bundledEditorDir
}

tasks.named("preBuild").configure {
    dependsOn "copyFrontendDist"
}
